services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      my_network: {}

  redis:
    image: redis:7-alpine
    networks:
      my_network: {}

  postgres:
    build:
      context: .
      dockerfile: 1Dockerfile.postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "C:/DatabaseBackup:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    networks:
      my_network: {}

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
